<!DOCTYPE html>
<html>
<head>
<title>Event Registration Form</title>
<style>
body{
font-family: arial;
background: lightblue;
}
.Container{
width: 350px;
margin: 50px auto;
padding: 20px;
background: white;
border: 1px solid grey;
}
h2{
text-alignment: center;
color: #333;
}
label{
display: block;
margin-top: 10px;
}
input,
select{
width: 100%;
padding: 8px;
margin-top: 5px;
border: 1px solid #ccc;
border-radius: 4px;
}
input{
margin-top:15px;
background: blue;
color: white;
border-radius: none;
cursor: pointer;
}
</style>
</head>
<body>
<div class = "container">
<form>
<label>Name</label>
<input type="text" placeholder="enter your name">
<label>email</label>
<input type="email" placeholder="enter your email">
<label>password</label>
<input type="tel" placeholder="enter your password">
<input type="Login" value="register">
</form>
</div>
</body>
</html>
